name: Bug Report
description: Report a bug in the Python or npm package, or the API
body:
  - type: input
    id: package-version
    attributes:
      label: Package & version
      placeholder: tribulnation-catalogue==0.5.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The failing call and the error or wrong result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
